[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revive-tery-ml"
version = "0.1.0"
description = "Standalone data-quality, triage, state-estimation and second-life routing engine for REVIVE-TERY"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "mapie>=1.0",
    "pydantic>=2.6",
    "pandera>=0.20",
    "pyyaml>=6",
    "typer>=0.12",
    "requests>=2.31",
    "h5py>=3.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "rust-just>=1.30", "duckdb>=1.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
revive-ml = "revive_ml.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["datasets: needs downloaded public datasets (skipped if absent)"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N803", "N806"]
